<head>
  <meta charset="UTF-8">
    <meta name ="viewport"content="width=device-width, initial-scale=1.0">
  <title>jadwal & progres tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>jadwal & progres tracker</h1>
    <p class="subtitle">pantau dan kelola jadwal pelajaran di sini!</p>
     <div class="card form-section">
       <h2>+ Tambah Jadwal Baru</h2>
      <div class="form-group">
        <input type="text" id="matkulInput" placeholder="Nama Pelajaran / Mata Kuliah">
        <input type="text" id="hariInput" placeholder="Hari, Jam, atau Keterangan">
        <button id="addBtn">Tambah Ke Tracker</button>
      </div>
    </div>
    <div class="card list-section">
      <h2>Daftar Pelajaran & Kegiatan</h2>
      <ul id="trackerList">
        </ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
